<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 13</title>
</head>
<style>
    body {
        background-color: lemonchiffon;
        box-sizing: border-box;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        margin: 0;
        min-height: 100vh;
    }

    .container {
        background: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
    }

    p {
        color: #d9534f;
        font-size: 14px;
        margin-top: 4px;
        height: 15px;
    }

    .error {
        color: red;
    }
</style>

<body>
    <div class="container">
        <h1>Task : Registration Form Validation</h1><br>

        Name : <input type="name" id="name" placeholder="Enter name">
        <p id="nameErr" class="error"></p>

        Email : <input type="email" id="email" placeholder="Enter email">
        <p id="emailErr" class="error"></p>

        Phone : <input type="number" id="phone" placeholder="Enter phone number">
        <p id="phoneErr" class="error"></p>

        Password : <input type="password" id="password" placeholder="Enter password">
        <p id="passwordErr" class="error"></p>

        Confirm Password : <input type="password" id="confirmPassword" placeholder="Enter confirmed password">
        <p id="confirmPasswordErr" class="error"></p><br>

        <button id="registerBtn">Register</button>

        <script>
            let submit = document.getElementById("registerBtn");
            
            submit.addEventListener("click", (e) => {

                e.preventDefault();
                
                let enteredName = document.getElementById("name").value;
                let enteredEmail = document.getElementById("email").value;
                let enteredPhone = document.getElementById("phone").value;
                let enteredPassword = document.getElementById("password").value;
                let confirmPassword = document.getElementById("confirmPassword").value;
                let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                let validation = true;

                // Name Validation
                if (enteredName == "") {
                    document.getElementById("nameErr").innerText = "Name is required !";
                    validation = false;
                }
                else if (enteredName.length < 3) {
                    document.getElementById("nameErr").innerText = "Name must contain at least 3 characters !";
                    validation = false;
                }
                else {
                    document.getElementById("nameErr").innerText = "";
                }

                // Email Validation
                if (enteredEmail == "") {
                    document.getElementById("emailErr").innerText = "Email is required !";
                    validation = false;
                }
                else if (!emailPattern.test(enteredEmail)) {
                    document.getElementById("emailErr").innerText = "Email must be valid !";
                    validation = false;
                }
                else {
                    document.getElementById("emailErr").innerText = "";
                }

                // Phone Validation
                if (enteredPhone == "") {
                    document.getElementById("phoneErr").innerText = "Phone is required !";
                    validation = false;
                }
                else if (enteredPhone.length < 10) {
                    document.getElementById("phoneErr").innerText = "Phone must contain 10 digits !";
                    validation = false;
                }
                else {
                    document.getElementById("phoneErr").innerText = "";
                }

                // Password Validation 
                if (enteredPassword == "") {
                    document.getElementById("passwordErr").innerText = "Password is required !";
                    validation = false;
                }
                else if (enteredPassword.length < 6) {
                    document.getElementById("passwordErr").innerText = "Password must contain at least 6 characters !";
                    validation = false;
                }
                else {
                    document.getElementById("passwordErr").innerText = "";
                }

                // Confirm Password Validation
                if (confirmPassword == "") {
                    document.getElementById("confirmPasswordErr").innerText = "Password is required !";
                    validation = false;
                }
                else if (confirmPassword != enteredPassword) {
                    document.getElementById("confirmPasswordErr").innerText = "Password and Confirm Password must match !   ";
                    validation = false;
                }
                else {
                    document.getElementById("confirmPasswordErr").innerText = "";
                }

                // If all validations are true
                if (validation) {
                    alert("Form submitted Successfully !");
                }
            });
        </script>

    </div>
</body>

</html>
