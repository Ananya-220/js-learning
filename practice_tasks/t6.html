<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Task 6</title>
</head>

<body>

    <h1>Practice Task 6</h1>

    <p>Button Clicked : <span id="btn-count">0</span></p>

    <button onclick="increase()">Increase</button>

    <button onclick="decrease()">Decrease</button>

    <script>

        let counter = document.getElementById('btn-count');

        function increase() {
            let count = parseInt(counter.innerHTML) + 1;
            counter.innerHTML = count;
        }

        function decrease() {
            let count = parseInt(counter.innerHTML) - 1;
            if (count >= 0) {
                counter.innerHTML = count;
            }
        }

    </script>


</body>

</html>
