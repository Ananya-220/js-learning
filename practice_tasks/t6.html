<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Task 6</title>
</head>

<body>

    <h1>Practice Task 6</h1>

    <p>Button Clicked : <span id="btn-count">0</span></p> 

    <button onclick="increase()">Increase</button>

    <button onclick="decrease()">Decrease</button>

    <script>
        let count = 0;
        function increase() {
            var btnCount = document.getElementById("btn-count");
            btnCount.innerHTML = ++count;
        }

        function decrease() {
            var btnCount = document.getElementById("btn-count");
            if (count > 0) {
                btnCount.innerHTML = --count;
            }
        }
    </script>


</body>
</html>
