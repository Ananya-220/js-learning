<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Task 5</title>
</head>

<body>

    <h1>Practice Task 5</h1>

    <p>Button Clicked : <span id="btn-count">0</span></p> 

    <button id="btn-click" onclick="increase()">Increase</button>

    <script>
        let count = 0;
        function increase() {
            var btnCount = document.getElementById("btn-count");
            btnCount.innerHTML = ++count;
        }
    </script>


</body>
</html>
