<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Task 7</title>
</head>

<body>

    <h1>Practice Task 7</h1>

    <form id="demoForm">
        Name : <input type="text" id="name" placeholder="Enter your name">
        <p id="nameErr" style="color: red;"></p><br><br>

        Age : <input type="number" id="age" placeholder="Enter your age">
        <p id="ageErr" style="color: red;"></p><br><br>

        City : <input type="text" id="city" placeholder="Enter your city">
        <p id="cityErr" style="color: red;"></p><br><br>

        <button onclick="showDetails(event)">Show Details</button>

        <button onclick="reset()">Reset</button>

        <p id="display"></p>
    </form>

    <script>
        function showDetails(e) {
            e.preventDefault()
            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let city = document.getElementById("city").value;
            let validation = true;

            if (name == "") {
                document.getElementById("nameErr").innerText = "Name is required !";
                validation = false;
            }
            else {
                document.getElementById("nameErr").innerText = "";
            }

            if (age == "" || age < 0) {
                document.getElementById("ageErr").innerText = "Age is required !";
                validation = false;
            }
            else {
                document.getElementById("ageErr").innerText = "";
            }

            if (city == "") {
                document.getElementById("cityErr").innerText = "City is required !";
                validation = false;
            }
            else {
                document.getElementById("cityErr").innerText = "";
            }

            if (validation) {
                document.getElementById("display").innerText = `Name : ${name}
                Age : ${age}
                City : ${city}`;

            }
            else {
                document.getElementById("display").innerText = "";
            }
        }

    </script>

</body>

</html>
