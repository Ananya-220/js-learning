<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3</title>
</head>
<body>
    <h1>Task 3</h1>
    <div id="toggle">Hello , My Name is Ananya Sharma !</div><br>
    <button onclick="toggle()">Click to toggle</button>

    <script>
        function toggle() {
            var divToggle = document.getElementById("toggle");
            if (divToggle.style.display === "none") {
                divToggle.style.display = "block";
            }
            else {
                divToggle.style.display  = "none";
            }
        }
    </script>

</body>
</html>
