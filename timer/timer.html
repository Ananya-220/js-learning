<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1>Functional Timer</h1>

        <div class="inputs">
            <input type="number" id="hours" class="hours" placeholder="HH">
            <span>:</span>
            <input type="number" id="minutes" class="minutes" placeholder="MM">
            <span>:</span>
            <input type="number" id="seconds" class="seconds" placeholder="SS">
        </div>

        <div id="display">00:00:00</div>

        <div class="buttons">
            <button id="start" class="start">Start</button>
            <button id="pause" class="pause">Pause</button>
            <button id="reset" class="reset">Reset</button>
        </div>

    </div>

    <script src="timer.js"></script>

</body>
</html>
