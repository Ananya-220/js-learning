<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 11</title>
</head>

<style>
    body {
        background-color:rgb(173, 214, 240);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }

    h1 {
        margin-top: 100px;
        background-color: white;
    }

    #Countdown {
        text-align: center;
        background-color: white;
        font-size: 70px;
        width: 400px;
        margin: auto;
        padding-bottom: 20px;
        border: 2px solid black;
        border-radius: 20px;
    }
    button {
        font-size: large;
        background-color: rgb(173, 214, 240);
    }
</style>

<body>

    <h1 align="center">Task : Countdown Timer</h1>

    <div id="Countdown">
        <p id="timer">05 : 00</p>
        <button onclick="startTimer()">Start</button>
        <button onclick="pauseTimer()">Pause</button>
        <button onclick="resetTimer()">Reset</button>
    </div>

    <script>

        let time = 5 * 60;
        let timer;

        function startTimer() {
            timer = setInterval(() => {
                if (time > 0) {
                    time--;
                    let minutes = Math.floor(time / 60);
                    let seconds = time % 60;
                    if (seconds < 10) {
                        seconds = `0${seconds}`;
                    }
                    document.getElementById("timer").innerHTML = `0${minutes} : ${seconds}`;
                }
                else {
                    clearInterval(timer);
                    alert("Time's Up!");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timer);
        }

        function resetTimer() {
            clearInterval(timer);
            time = 5 * 60;
            document.getElementById("timer").innerHTML = "05 : 00";
        }

    </script>

</body>

</html>
