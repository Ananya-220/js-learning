<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 8</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: lightblue;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            width: 550px;
            max-width: 90%;
            min-height: 400px;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid black;
            text-align: center;
        }

        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid black;
            border-radius: 8px;
            padding: 0 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: none;
            outline: none;
        }

        .search-icon {
            font-size: 18px;
        }

        #clear {
            border: none;
            background: none;
            font-size: 18px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li {
            font-size: 16px;
            padding: 8px;
        }

        #noResults {
            color: red;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Task : Live Search</h1>

        <div class="search-box">
            <span class="search-icon">🔍</span>

            <input type="text" id="input" placeholder="Search Food Items Here">

            <button id="clear">x</button>
        </div>

        <ul id="foodList">
            <li>Pizza</li>
            <li>Cheese Burger</li>
            <li>Hakka Noodles</li>
            <li>Veg Manchurian</li>
            <li>French Fries</li>
            <li>White Sauce Pasta</li>
            <li>Cold Coffee</li>
            <li>Chocolate Shake</li>
        </ul>

        <p id="noResults"></p>

    </div>

    <script>
        let searchInput = document.getElementById("input");
        let listItems = document.querySelectorAll("ul li");
        let clearButton = document.getElementById("clear");
        let noResults = document.getElementById("noResults");

        searchInput.addEventListener("input", () => {

            let searchItem = searchInput.value.toLowerCase();
            let found = false;

            listItems.forEach((item) => {

                let food = item.innerHTML.toLowerCase();

                if (food.includes(searchItem)) {
                    item.style.display = "";
                    found = true;
                } 
                else {
                    item.style.display = "none";
                }

            });

            if (found) {
                noResults.innerHTML = "";
            } 
            else {
                noResults.innerHTML = "No results found.";
            }

        });

        clearButton.addEventListener("click", () => {
            searchInput.value = "";
        });

    </script>

</body>

</html>
